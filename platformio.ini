 ; Single-firmware project. Place your Edge Impulse Arduino export folders
; (edge-impulse-sdk/, model-parameters/, tflite-model/) NEXT TO this file,
; inside smart-glasses-final/, exactly as in the export ZIP.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 N16R8: QSPI flash, octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; Kept from your working project.
board_build.partitions = partitions_pico.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -I.
    -O3
    -ffast-math
    -fno-math-errno
    -DEI_MAX_OVERFLOW_BUFFER_COUNT=32
; Pulls in src/main.cpp plus the Edge Impulse export folders at project root.
build_src_filter =
    -<*>
    +<main.cpp>
    +<../edge-impulse-sdk/>
    +<../model-parameters/>
    +<../tflite-model/>
lib_deps =
    https://github.com/bluejunimo/YX5300_ESP32.git